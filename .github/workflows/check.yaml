name: Check Markdown links

on:
  push:
  workflow_dispatch:
  schedule:
  - cron: "0 3 1 * *"

permissions:
  contents: read

jobs:
  markdown-link-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@main
    - uses: michaelkreil/check-markdown-links@main
      with:
        # npmjs.com answers automated requests with 403
        skip_hosts: |
          www.npmjs.com
